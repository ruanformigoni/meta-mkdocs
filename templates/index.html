<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meta MkDocs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
</head>
<body class="bg-dark">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Meta MkDocs</h1>
        <!-- Project Creation Form -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form method="post" action="/create" class="row g-3">
                    <div class="col">
                        <label for="name" class="form-label">New Project Name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            class="form-control"
                            placeholder="Enter project name"
                            required
                        >
                    </div>
                    <div class="col-auto d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Create</button>
                    </div>
                </form>
                {% if error %}
                    <div class="alert alert-danger mt-3" role="alert">
                        {{ error_msg }}
                    </div>
                {% endif %}
            </div>
        </div>

        <!-- Existing Projects List -->
        <div class="card mb-4">
            <div class="card-body">
                <h4>Projects</h4>
                <hr>
                {% for project in projects %}
                    <div class="row bg-light-subtle mb-3 p-2 rounded mx-1">
                        <div class="col-8 align-self-center">
                            {{ project }}
                        </div>
                        <div class="col">
                            <div class="row row-cols-1 row-cols-lg-3 g-2">
                                <div class="col">
                                    <form method="post" action="/serve" class="d-inline">
                                        <input type="hidden" name="name" value="{{ project }}">
                                        <button type="submit" class="btn btn-success w-100">Serve</button>
                                    </form>
                                </div>
                                <div class="col">
                                    <a href="http://{{ domain }}:{{ port_editor }}/{{ project }}" target="_blank" class="btn btn-primary w-100">Edit</a>
                                </div>
                                <div class="col">
                                    <form method="post" action="/delete" class="d-inline">
                                        <input type="hidden" name="name" value="{{ project }}">
                                        <button type="submit" class="btn btn-danger w-100">Del</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>

        <!-- Served Project -->
        <div class="card mb-4">
            <div class="card-body">
                <h2 class="h4">Serving</h2>
                <hr>
                {% if serving.len() > 0 %}
                <div class="row bg-light-subtle mb-3 p-2 rounded mx-1">
                    <div class="col-8 align-self-center">
                        {{ serving }}
                    </div>
                    <div class="col">
                        <a href="http://{{ domain }}:{{ port_serve }}" target="_blank" class="btn btn-primary w-100">Preview</a>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>

    </div>
</body>
</html>
